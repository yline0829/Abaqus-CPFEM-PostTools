name: Feature request
description: Suggest a post-processing capability or workflow improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Use case
      description: What analysis are you trying to perform?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant Abaqus/CPFEM variables
      description: Include SDV definitions or history/field output names if model-specific.
